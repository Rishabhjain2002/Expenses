# Pinned light theme so the Plotly palette (validated against the #fcfcfb chart
# surface) always renders against the surface it was checked on.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 50
