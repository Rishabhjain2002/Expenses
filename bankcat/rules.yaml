# Merchant / keyword dictionary for Indian bank statements.
#
# Each pattern is a case-insensitive regular expression matched against both the cleaned
# merchant name and the full raw narration. When several patterns match a transaction the
# LONGEST pattern wins, so a specific rule always beats a general one — "amazon prime"
# lands in Entertainment even though "amazon" is listed under Shopping.
#
# To teach the tool a new merchant, add a line here. No code change is needed; the app
# picks it up on the next reload. Keep patterns lowercase and specific enough not to
# collide (prefer "big bazaar" over "big").

